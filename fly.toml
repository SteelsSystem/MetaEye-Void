app = "needle-discord-metacog"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NEEDLE_TELEMETRY = "0"
  DO_NOT_TRACK = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "2s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
